name: macOS DMG
on:
  pull_request:
    paths:
      - frontend/electron/**
      - frontend/src/pages/desktop/**
      - frontend/src/shared/store/recordingStore/**
      - frontend/src/modules/widgets/recording/**
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - .github/workflows/macos-dmg.yml
      - .github/workflows/publish-macos-dmg.yml
  workflow_dispatch:
    inputs:
      version:
        description: "버전 X.Y.Z (비우면 다음 minor)"
        required: false
        type: string
      headline:
        description: "버전 뒤에 표시할 변경 요약"
        required: true
        type: string

      signing:
        description: "배포 유형 (preview는 Apple 공증 없음)"
        type: choice
        default: notarized
        options:
          - notarized
          - preview

permissions:
  contents: read

jobs:
  prepare:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    outputs:
      version: ${{ steps.notes.outputs.version }}
      title: ${{ steps.notes.outputs.title }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover frontend/electron -p test_release_notes.py
      - id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          HEADLINE: ${{ inputs.headline || 'macOS 릴리스 미리보기' }}
        run: |
          python3 frontend/electron/release-notes.py "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
      - name: 배포 설정 확인
        if: github.event_name == 'workflow_dispatch'
        env:
          SIGNING: ${{ inputs.signing }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_NOTARY_KEY_P8: ${{ secrets.MAC_NOTARY_KEY_P8 }}
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER: ${{ secrets.MAC_NOTARY_ISSUER }}
          KNOT_DESKTOP_URL: ${{ vars.KNOT_DESKTOP_URL }}
        run: |
          required=(KNOT_DESKTOP_URL)
          if [[ "$SIGNING" == notarized ]]; then
            required+=(MAC_CERT_P12 MAC_CERT_PASSWORD MAC_NOTARY_KEY_P8 MAC_NOTARY_KEY_ID MAC_NOTARY_ISSUER)
          fi
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::등록이 필요한 Actions 설정: ${missing[*]}"
            exit 1
          fi

  dmg:
    needs: prepare
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: frontend
    env:
      KNOT_MAC_ARCH: ${{ matrix.arch }}
      KNOT_MAC_VERSION: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.version || '0.0.0' }}
      KNOT_MAC_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.signing == 'notarized' && '1' || '0' }}
      KNOT_MAC_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.signing == 'preview' && '1' || '0' }}
      KNOT_NOTARY_PROFILE: knot-notary
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node --test electron/publish-dmg.test.mjs
      - name: Developer ID 인증서 가져오기
        if: env.KNOT_MAC_RELEASE == '1'
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}
      - name: 배포 서명과 공증 준비
        if: env.KNOT_MAC_RELEASE == '1'
        env:
          NOTARY_KEY: ${{ secrets.MAC_NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.MAC_NOTARY_ISSUER }}
        run: |
          identity=$(security find-identity -v -p codesigning | awk '/"Developer ID Application:/ { print $2 }')
          [[ "$identity" =~ ^[A-F0-9]{40}$ ]]
          echo "KNOT_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s' "$NOTARY_KEY" > "$key"
          xcrun notarytool store-credentials "$KNOT_NOTARY_PROFILE" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER"
      - name: DMG 생성 및 설치 검증
        env:
          RELEASE_API_URL: ${{ vars.KNOT_DESKTOP_API_URL }}
          RELEASE_URL: ${{ vars.KNOT_DESKTOP_URL }}
        run: |
          [[ $(node -p 'process.arch') == "$KNOT_MAC_ARCH" ]]
          if [[ "$KNOT_MAC_RELEASE" == 1 || "$KNOT_MAC_PREVIEW" == 1 ]]; then
            export KNOT_DESKTOP_URL="${RELEASE_URL:?운영 Knot HTTPS 주소를 지정하세요}"
            export KNOT_DESKTOP_API_URL="$RELEASE_API_URL"
            suffix=""
          else
            export KNOT_DESKTOP_URL=https://localhost:3182
            suffix="-test"
          fi
          bash electron/build-dmg.sh
          bash electron/test-dmg.sh "dist-desktop/Knot-$KNOT_MAC_VERSION-$KNOT_MAC_ARCH$suffix.dmg"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: dmg-${{ matrix.arch }}
          path: frontend/dist-desktop/Knot-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.dmg
          if-no-files-found: error

  candidate:
    if: github.event_name == 'workflow_dispatch'
    concurrency: macos-release-${{ needs.prepare.outputs.version }}
    needs: [prepare, dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TITLE: ${{ needs.prepare.outputs.title }}
      SIGNING: ${{ inputs.signing }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: 동일 빌드의 두 DMG를 초안 릴리스에 첨부
        run: |
          tag="v$VERSION"
          arm="Knot-$VERSION-arm64.dmg"
          intel="Knot-$VERSION-x64.dmg"
          test -s "$arm" && test -s "$intel"
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > release-tags
          if grep -Fxq "$tag" release-tags; then echo "이미 존재하는 릴리스: $tag"; exit 1; fi
          # Avoid attaching a candidate to a tag from a different build.
          test "$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq "[.[] | select(.ref == \"refs/tags/$tag\")] | length")" = 0
          {
            echo
            echo '### SHA-256'
            echo
            echo '```'
            sha256sum "$arm" "$intel"
            echo '```'
          } >> notes.md
          release_flags=(--draft)
          if [[ "$SIGNING" == preview ]]; then
            release_flags+=(--prerelease)
            TITLE="$TITLE (macOS Preview)"
            {
              echo '> **macOS Preview** · 앱은 ad-hoc 서명되었으며 Apple Developer ID 서명과 공증은 없습니다.'
              echo '> 다운로드한 앱의 첫 실행을 macOS Gatekeeper가 차단할 수 있습니다.'
              echo '> [Apple의 macOS 앱 열기 안내](https://support.apple.com/102445)'
              echo
              cat notes.md
            } > preview-notes.md
            mv preview-notes.md notes.md
          fi
          gh release create "$tag" "$arm" "$intel" --target "$GITHUB_SHA" "${release_flags[@]}" --title "$TITLE" --notes-file notes.md
